:root{--bg:#000000;--panel:#0c0c0c;--panel2:#161616;--line:#262626;--text:#f2f2f2;--mute:#9a9a9a;--acc:#e8c45a;--acc2:#5cc8ff;--warn:#ffb454;--bad:#ff6b6b;--ok:#9be15d;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(70px + env(safe-area-inset-bottom));min-height:100vh;
  }
.mono{font-family:'JetBrains Mono',monospace}
.mute{color:var(--mute)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:9px 16px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);flex:none}
.brand{font-weight:700;line-height:1.1}
.brand small{display:block;font:500 10px 'JetBrains Mono',ui-monospace,monospace;color:var(--mute);letter-spacing:.12em;text-transform:uppercase}
.status{margin-left:auto;font:11px 'JetBrains Mono',ui-monospace,monospace;color:var(--mute);display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.warn{background:var(--warn)}
.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
main{padding:12px 14px 30px;max-width:780px;margin:0 auto}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;background:none;border:0;color:var(--mute);padding:9px 2px 8px;font:500 11.5px 'Space Grotesk',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabs button.on{color:var(--acc)}
.tabs svg{width:22px;height:22px}
h1{font-size:24px;margin:8px 0 2px;letter-spacing:-.01em}
h2{font-size:20px;margin:4px 0}
.sub{color:var(--mute);font-size:13px;margin-bottom:8px;line-height:1.45}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.label{font:600 11px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{color:var(--mute);font-size:13px}
.empty{color:var(--mute);font-size:14px;padding:6px 0;line-height:1.5}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:11px;padding:10px 14px;font:600 14px 'Space Grotesk',system-ui,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#1a1405}
.btn.ghost{background:transparent}
.btn.bad{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.4}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font:500 12px 'JetBrains Mono',ui-monospace,monospace;padding:3px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--text);margin:0 4px 4px 0;white-space:nowrap}
.chip.acc{border-color:rgba(232,196,90,.55);color:var(--acc)}
.chip.sun{border-color:rgba(255,213,92,.55);color:#ffd55c}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin:6px 0 10px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:7px;border-radius:9px;font:600 13px 'Space Grotesk',system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--text)}
.back{background:none;border:0;color:var(--mute);font:500 14px 'Space Grotesk',system-ui,sans-serif;padding:6px 0;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:500}
.pre{white-space:pre-wrap;line-height:1.55;font-size:14.5px}
.sec h4{margin:14px 0 6px;font:600 11px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.tablewrap{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font:600 10.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
td.n,th.n{font-family:'JetBrains Mono',ui-monospace,monospace;text-align:right}
tr.click{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:3px}
.fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));min-width:54px;height:54px;padding:0 16px;border-radius:17px;background:var(--acc);color:#1a1405;border:0;display:flex;align-items:center;gap:6px;font:700 14px 'Space Grotesk',system-ui,sans-serif;box-shadow:0 8px 24px rgba(232,196,90,.25);z-index:4;cursor:pointer}
.fab svg{width:24px;height:24px}
.banner{background:rgba(255,180,84,.1);border:1px solid rgba(255,180,84,.4);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0;line-height:1.45}
.plate{display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-left:4px solid var(--c,#888);border-radius:12px;background:var(--panel2);margin:8px 0;cursor:pointer}
.plate .grow{flex:1;min-width:0}
.plate .t{font-weight:700}
.plate .d{font-size:12.5px;color:var(--mute);margin-top:2px}
.big{font:700 22px 'JetBrains Mono',ui-monospace,monospace;color:var(--acc);text-align:right;line-height:1}
.big small{display:block;font:500 10.5px 'JetBrains Mono',ui-monospace,monospace;color:var(--mute);margin-top:3px}
.stages{display:flex;gap:3px;margin:10px 0 4px}
.stages div{flex:1;text-align:center;font:600 10px 'JetBrains Mono',ui-monospace,monospace;padding:6px 2px;border-radius:7px;background:var(--panel2);color:var(--mute);border:1px solid var(--line)}
.stages div.done{color:var(--text)}
.stages div.now{background:var(--acc);color:#1a1405;border-color:var(--acc)}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 64px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}
.hbar .tr{height:12px;background:var(--panel2);border-radius:6px;position:relative;overflow:hidden;border:1px solid var(--line)}
.hbar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.hbar .v{font-family:'JetBrains Mono',ui-monospace,monospace;text-align:right}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc h3{font-size:17px;margin:16px 0 6px}
.doc p{line-height:1.6;margin:6px 0;font-size:14.5px}
.doc ol{padding-left:20px;line-height:1.6;font-size:14.5px}
.doc li{margin:5px 0}
.ref{font-size:13px;color:var(--mute)}
/* forms */
label{display:block;font-size:12.5px;color:var(--mute);margin:10px 0 0;font-weight:500}
input,select,textarea{width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 11px;font:15px 'Space Grotesk',system-ui,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input.err{border-color:var(--bad)}
input[type=checkbox]{width:auto;margin:0 8px 0 0;accent-color:var(--acc);transform:scale(1.25)}
.check{display:flex;align-items:center;color:var(--text);font-size:15px;margin-top:12px}
textarea{resize:vertical;line-height:1.45}
input[type=date],input[type=time],input[type=datetime-local]{color-scheme:dark}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fieldset{border:1px solid var(--line);border-radius:12px;padding:4px 10px 10px;margin-top:14px}
.fieldset>.label{margin:8px 0 2px}
.drow{display:grid;gap:6px;align-items:end;margin-top:8px}
.drow input{margin-top:0;padding:8px 9px;font-size:14px}
.drow .x{background:none;border:1px solid var(--line);color:var(--bad);border-radius:9px;height:37px;width:37px;font-size:18px;cursor:pointer}
.stage-row{grid-template-columns:1fr 90px 37px}
.ing-row{grid-template-columns:1fr 80px 64px 37px}
.addrow{margin-top:8px;background:none;border:1px dashed var(--line);color:var(--acc);border-radius:9px;padding:7px 10px;font:600 13px 'Space Grotesk',system-ui,sans-serif;width:100%;cursor:pointer}
.hint{font-size:12px;color:var(--mute);margin-top:5px;line-height:1.45}
.live{font:600 13px 'JetBrains Mono',ui-monospace,monospace;color:var(--acc);margin-top:6px}
.groupsel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.groupsel label{margin:0}
.groupsel input{display:none}
.groupsel span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:10px;color:var(--text);font-weight:600;font-size:14px;cursor:pointer}
.groupsel small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.groupsel input:checked+span{border-color:var(--acc);background:rgba(232,196,90,.12)}
.batch td{padding:5px 6px}
.batch input{margin:0;padding:8px;font-size:15px;width:90px}
/* sheet */
#sheet-root{position:fixed;inset:0;z-index:20;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .2s}
#sheet-root.open .backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:780px;margin:0 auto}
#sheet-root.open .sheet{transform:none}
.sheet-h{padding:8px 16px 4px;text-align:center}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.sheet-h h3{margin:0;font-size:17px}
.sheet-b{overflow-y:auto;padding:0 16px 16px;flex:1}
.sheet-f{display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sheet-f .sp{flex:1}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:30;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
svg text{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;fill:var(--mute)}

.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.thumb{position:relative;width:76px;height:76px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:1px solid var(--line)}
.tx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--bad);color:#fff;border:0;font-size:14px;line-height:1}
.addphoto{width:76px;height:76px;border:1px dashed var(--acc);border-radius:9px;display:grid;place-items:center;color:var(--acc);font-size:12px;margin:0;text-align:center;cursor:pointer}

.pth span{position:absolute;right:4px;bottom:4px;width:22px;height:22px;border-radius:11px;background:rgba(0,0,0,.75);color:#fff;font-size:13px;line-height:22px;text-align:center}
.sigs{margin-top:8px}
.srow{display:grid;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.srow.sh{border-top:0;padding:2px 0;font:600 10.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.srow .sv{font:700 13px 'JetBrains Mono',ui-monospace,monospace;display:flex;align-items:center;gap:6px}
.srow .sl{line-height:1.3}
.srow .si{display:flex;flex-direction:column;gap:3px}
.srow .si small{font-size:10.5px;color:var(--mute)}
.srow .bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.srow .bar span{display:block;height:100%;background:var(--text)}
.srow .sn{font-style:normal;width:20px;height:20px;border-radius:50%;background:#e8c45a;color:#000;font:700 10.5px/20px 'JetBrains Mono',ui-monospace,monospace;text-align:center;flex:none}
.srow.dim{opacity:.45}
.gal .srow[data-bx]{cursor:pointer}
.role{font:600 10.5px 'JetBrains Mono',ui-monospace,monospace;padding:2px 7px;border-radius:999px;border:1px solid var(--line)}
.role.r-p{color:var(--acc);border-color:var(--acc)}.role.r-s{color:var(--acc2);border-color:var(--acc2)}
.schips{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.slab{font:600 10.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.schips>div{display:flex;flex-wrap:wrap;gap:6px}
.sc{font:600 12px 'Space Grotesk',system-ui,sans-serif;padding:4px 9px;border-radius:999px;border:1px solid var(--text);color:var(--text)}
.sc.no{border-color:var(--line);color:var(--mute)}
.pub{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.pub .ph{display:flex;align-items:center;margin-bottom:6px}.pub .ph .btn{margin-left:auto}
.pub .pt{font:12px/1.5 'JetBrains Mono',ui-monospace,monospace;word-break:break-word}
.gal{position:fixed;inset:0;z-index:60;background:#000;color:#f2f2f2;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);--line:#262626;--mute:#9a9a9a;--text:#f2f2f2;--acc:#e8c45a;--acc2:#5cc8ff}
.g-top{display:flex;align-items:center;gap:10px;padding:10px 14px}
.g-x{width:44px;height:44px;border-radius:22px;border:0;background:#1a1a1a;color:#f2f2f2;font-size:18px;cursor:pointer;flex:none}
.g-t{display:flex;flex-direction:column;line-height:1.2;min-width:0}.g-t b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.g-t span{font-size:12px;color:#9a9a9a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-n{margin-left:auto;font:600 13px 'JetBrains Mono',ui-monospace,monospace;color:#cfcfcf;flex:none}
.g-stage{position:relative;flex:none;height:min(48vh,460px);overflow:hidden;touch-action:none;background:#000}
.g-wrap{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.g-wrap .mkwrap{width:100%;height:100%}.g-wrap img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.gal .mk-band b,.gal .mk-band em,.gal .mk-ax span,.gal .mk-spot em,.gal .mk-lane,.gal .mk-line span{scale:var(--iz,1)}
.gal .mk-band b{transform-origin:center}.gal .mk-band em{transform-origin:left bottom}
.g-z{position:absolute;left:10px;top:10px;font:700 12px 'JetBrains Mono',ui-monospace,monospace;background:rgba(0,0,0,.8);color:#e8c45a;padding:4px 9px;border-radius:999px;pointer-events:none}
.g-mini{position:absolute;right:10px;top:10px;width:110px;border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.2),0 4px 14px rgba(0,0,0,.4);background:#fff;pointer-events:none}
.g-mini img{display:block;width:100%;height:auto}
.g-prev,.g-next{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:20px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:24px;line-height:38px;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.g-prev{left:8px}.g-next{right:8px}
.g-dots{display:flex;justify-content:center;gap:6px;padding:10px 0 2px}.g-dots span{width:6px;height:6px;border-radius:3px;background:#444}.g-dots span.on{width:18px;background:#e8c45a}
.g-hint{text-align:center;font-size:11.5px;color:#8a8a8a;padding:6px 10px}
.g-panel{flex:1;min-height:0;overflow:auto;background:#0e0e0e;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.g-grab{width:40px;height:4px;border-radius:2px;background:#333;margin:0 auto 8px}
.gp-h{display:flex;align-items:baseline;gap:8px}.gp-h b{font-size:16px}.gp-h span{font-size:12px;color:#9a9a9a}.gp-h em{font-style:normal}.gp-h .u{margin-left:auto;font:600 11px 'JetBrains Mono',ui-monospace,monospace}
.gchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.gchips span{font:500 11.5px 'JetBrains Mono',ui-monospace,monospace;padding:4px 8px;border-radius:999px;border:1px solid #2a2a2a;color:#cfcfcf}
.gconcl{margin-top:10px;background:#14110a;border:1px solid #4a3d14;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.gconcl b{display:block;font:600 10.5px 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:#e8c45a;margin-bottom:4px}
.gp-empty{color:#9a9a9a;font-size:13px;padding:8px 0}
.gal .srow .bar span{background:#e8c45a}
</style>
</head>
<body>
<header class="top">
  <div class="logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 64 64"><path d="M22.5 10h19v2l-5.2 5.2h-8.6L22.5 12z" fill="#7fb8ff" fill-opacity=".55"/><rect x="28" y="21" width="8" height="25" fill="#f3efe3"/><rect x="28" y="24" width="8" height="4" fill="#e8c45a"/><rect x="28" y="31" width="8" height="4" fill="#e07b39"/><rect x="28" y="38" width="8" height="4" fill="#7a4fa8"/><path d="M20 6h24v7l-6 6v27H26V19l-6-6z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M30 46h4v9l-1 3h-2l-1-3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><rect x="23" y="49" width="18" height="4" rx="2" fill="currentColor"/><circle cx="32" cy="61.5" r="2" fill="#e8c45a"/></svg></div>
  <div class="brand">Notatnik Syntez<small>syntezy · TLC · widma</small></div>
  <button class="status" data-a="settings" aria-label="Ustawienia i zapis"><span class="dot" id="sdot"></span><span id="stext">łączenie…</span></button>
  <button class="iconbtn" data-a="settings" aria-label="Ustawienia"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-a="tab" data-v="prowadzone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Prowadzone</button>
  <button data-a="tab" data-v="syntezy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 2h10v3l-3 3v10h-4V8L7 5z"/><path d="M10 11h4M10 14.5h4"/><path d="M8.5 19h7"/><path d="M12 19v2.5"/></svg>Syntezy</button>
  <button data-a="tab" data-v="zwiazki"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>Związki</button>
  <button data-a="tab" data-v="analizy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18h3l2-9 3 12 3-16 2 13h5"/></svg>Analizy</button>
</nav>
<div id="sheet-root"></div>
<div id="toast"></div>

<script>
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId=()=>'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const fmtDY=s=>fmtD(s);
const MON=['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
const nowLocal=()=>{const d=new Date();return `${ymd(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const parseDT=s=>{if(!s)return new Date(NaN);const [d,t='00:00']=String(s).split('T');const [y,m,dd]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);return new Date(y,(m||1)-1,dd||1,h||0,mi||0)};
const hoursBetween=(a,b)=>(parseDT(b)-parseDT(a))/36e5;
const fmtDT=s=>{const d=parseDT(s);if(isNaN(d))return'–';return `${d.getDate()} ${MON[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtD=s=>{const d=parseDT(s);if(isNaN(d))return'–';return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`};
const num=v=>{if(v===''||v==null)return null;const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null};
const fmtNum=n=>{if(n==null||!isFinite(n))return'–';const a=Math.abs(n);let s=a>=100?n.toFixed(0):a>=10?n.toFixed(1):n.toFixed(2);if(s.includes('.'))s=s.replace(/\.?0+$/,'');return s.replace('.',',')};
const fmtAge=h=>{if(h==null||!isFinite(h))return'–';if(h<0)return'za '+fmtAge(-h);if(h<48)return Math.floor(h)+' h '+pad(Math.round((h%1)*60))+' min';return Math.floor(h/24)+' d '+Math.floor(h%24)+' h'};
function stats(arr){const n=arr.length;if(!n)return null;const m=arr.reduce((a,b)=>a+b,0)/n;const sd=n>1?Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/(n-1)):0;return{n,m,sd}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2300)}
const ICON={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>'
};


/* ===== store ===== */
const LKEY='syntezylab-v1';
const Store={
  items:new Map(),mode:'loading',col:null,
  list(kind){return [...this.items.values()].filter(x=>x.kind===kind)},
  get(id){return this.items.get(id)},
  async save(obj){const o=JSON.parse(JSON.stringify(obj));if(!o.id)o.id=newId();o.updated=Date.now();if(!o.created)o.created=o.updated;this.items.set(o.id,o);
    if(this.col){try{await this.col.doc(o.id).set(o)}catch(e){dbError(e)}}else this.persistLocal();render();return o},
  async remove(id){this.items.delete(id);if(this.col){try{await this.col.doc(id).delete()}catch(e){dbError(e)}}else this.persistLocal();render()},
  persistLocal(){try{localStorage.setItem(LKEY,JSON.stringify([...this.items.values()]))}catch(e){}},
  loadLocal(){try{JSON.parse(localStorage.getItem(LKEY)||'[]').forEach(x=>x&&x.id&&this.items.set(x.id,x))}catch(e){}}
};
function dbError(e){const c=e&&e.code;if(c==='quota_exceeded')toast('Baza pełna – usuń stare wpisy');else if(c==='revoked')toast('Utracono dostęp do bazy');else toast('Nie udało się zapisać – spróbuj ponownie');console.warn(e)}
function setStatus(kind,text){$('#sdot').className='dot '+(kind||'');$('#stext').textContent=text}
function goLocal(){Store.col=null;Store.mode='local';Store.items=new Map();Store.loadLocal();setStatus('warn','lokalnie');render()}
async function initStore(){
  if(!window.claude||typeof window.claude.use!=='function'){goLocal();return}
  let db=null,user=null,id=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  try{id=user?await user.id():null}catch(e){}
  if(!db||!id){goLocal();return}
  Store.col=db.collection('data/users/'+id);Store.mode='cloud-wait';
  const timer=setTimeout(()=>{if(Store.mode==='cloud-wait')setStatus('warn','brak połączenia…')},10000);
  Store.col.onSnapshot(snap=>{Store.items=new Map(snap.docs.map(d=>[d.id,Object.assign({},d.data(),{id:d.id})]));
    if(!snap.metadata.fromCache){clearTimeout(timer);Store.mode='cloud';setStatus('ok','zapisane')}render()},
    err=>{clearTimeout(timer);setStatus('warn',err&&err.code==='revoked'?'brak dostępu':'błąd bazy');Store.mode='cloud-err';render()});
}


const pendingPhotos=new Map();
async function compressImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1400,q=.82,out='';
    for(let k=0;k<10;k++){const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
      if(out.length<230000)return out;if(q>.55)q-=.1;else max=Math.round(max*.8)}
    return null;
  }finally{URL.revokeObjectURL(url)}
}
const photoSrc=id=>{if(!id)return null;if(String(id).startsWith('tmp'))return pendingPhotos.get(id);const p=Store.get(id);return p&&p.data};
const thumbEdit=(id,mk,rfBtn)=>{const src=photoSrc(id);return src?`<div class="thumb ${mk?'has-rf':''}" data-pid="${esc(id)}" ${mk?`data-marks="${esc(JSON.stringify(mk))}"`:''}><img src="${src}" alt="">${rfBtn?`<button type="button" class="trf" data-s="${rfBtn==='Pasma'?'bands':'rf'}">${rfBtn===true?'Rf':rfBtn}</button>`:''}<button type="button" class="tx" data-s="delphoto" aria-label="Usuń zdjęcie">×</button></div>`:''};
const photoField=(ids,key,marks)=>`<div class="photos full" data-key="${key}">${(ids||[]).map(id=>thumbEdit(id,marks&&marks[id],key==='tlc'?'Rf':key==='an'?'Pasma':false)).join('')}<label class="addphoto">+ zdjęcie<input type="file" accept="image/*" multiple hidden></label></div>`;
async function commitPhotos(box,noteId){const ids=[];if(!box)return ids;for(const t of box.querySelectorAll('.thumb')){let id=t.dataset.pid;if(id.startsWith('tmp')){const d=pendingPhotos.get(id);if(!d)continue;const o=await Store.save({kind:'photo',data:d,noteId});pendingPhotos.delete(id);id=o.id}ids.push(id)}return ids}
const photosView=(ids,marks,ctx)=>{ids=(ids||[]).filter(photoSrc);if(!ids.length)return'';ctx=ctx||{};const mk=id=>marks&&marks[id];const a=ids.filter(mk),b=ids.filter(id=>!mk(id));
  const at=`class="pview" data-title="${esc(ctx.title||'')}" data-sub="${esc(ctx.sub||'')}" data-tech="${esc(ctx.tech||'')}" data-concl="${esc(ctx.concl||'')}" data-cond="${esc((ctx.cond||[]).filter(Boolean).join('|'))}"`;
  if(ctx.thumbs)return `<div ${at}><div class="pthumbs">${ids.map(id=>`<button type="button" class="pth" data-a="viewPhoto" data-id="${id}" data-marks="${esc(JSON.stringify(mk(id)||null))}" aria-label="Otwórz w galerii"><img src="${photoSrc(id)}" alt=""><span>⤢</span></button>`).join('')}</div></div>`;
  return `<div ${at}>`+(a.length?`<div class="tlcfigs">${a.map(id=>`<div class="tlcfig" data-a="viewPhoto" data-id="${id}" data-marks="${esc(JSON.stringify(mk(id)))}"><div class="mkwrap"><img src="${photoSrc(id)}" alt="płytka TLC">${marksHtml(mk(id))}</div></div>`).join('')}</div>`:'')
   +(b.length?`<div class="pgrid">${b.map(id=>`<img src="${photoSrc(id)}" data-a="viewPhoto" data-id="${id}" data-marks="null" alt="zdjęcie">`).join('')}</div>`:'')+'</div>'};
const fmtRf=r=>r.toFixed(2).replace('.',',');
function rfOf(m,sp){if(!m||m.start==null||m.front==null)return null;const d=m.front-m.start;if(Math.abs(d)<1e-4)return null;return (sp.y-m.start)/d}
function marksHtml(m){if(!m)return'';let h='';
  if(m.start!=null)h+=`<div class="mk-line start" style="top:${m.start*100}%"><span>start</span></div>`;
  if(m.front!=null)h+=`<div class="mk-line front" style="top:${m.front*100}%"><span>czoło</span></div>`;
  (m.spots||[]).forEach((sp,i)=>{const rf=rfOf(m,sp);h+=`<div class="mk-spot" style="left:${sp.x*100}%;top:${sp.y*100}%"><b>${i+1}</b>${rf!=null?`<em>${sp.label?esc(sp.label)+' ':''}${fmtRf(rf)}</em>`:''}</div>`});return h}
/* rfString – zdefiniowane w aplikacji */
async function commitPhotosM(box,noteId){const out=[];if(!box)return out;for(const t of box.querySelectorAll('.thumb')){let id=t.dataset.pid;let mk=null;try{mk=JSON.parse(t.dataset.marks||'null')}catch(e){}
  if(id.startsWith('tmp')){const d=pendingPhotos.get(id);if(!d)continue;const o=await Store.save({kind:'photo',data:d,noteId});pendingPhotos.delete(id);id=o.id}out.push({id,marks:mk})}return out}

function setStatus(kind,text){$('#sdot').className='dot '+(kind||'');$('#stext').textContent=kind==='ok'?'':text}

/* ===== Rf: plamki rysowane od–do (nadpisuje wersję podstawową) ===== */
function spotRange(m,sp){if(sp.y0==null||sp.y1==null||Math.abs(sp.y1-sp.y0)<0.012)return null;const a=rfOf(m,{y:sp.y0}),b=rfOf(m,{y:sp.y1});return a==null||b==null?null:[Math.min(a,b),Math.max(a,b)]}
function marksHtml(m){if(!m)return'';if(m.bands)return bandMarksHtml(m);let h='';
  if(m.start!=null)h+=`<div class="mk-line start" style="top:${m.start*100}%"><span>start</span></div>`;
  if(m.front!=null)h+=`<div class="mk-line front" style="top:${m.front*100}%"><span>czoło</span></div>`;
  (m.lanes||[]).forEach(l=>{h+=`<div class="mk-lane" style="left:${l.x*100}%;top:${(m.start!=null?m.start:0.92)*100}%">${esc(l.label||'?')}</div>`});
  (m.spots||[]).forEach((sp,i)=>{const rf=rfOf(m,sp);const rg=spotRange(m,sp);const lab=rf!=null?`<em>${sp.label?esc(sp.label)+' ':''}${fmtRf(rf)}${rg?` <span style="opacity:.7">(${fmtRf(rg[0])}–${fmtRf(rg[1])})</span>`:''}</em>`:'';
    if(rg||(sp.y0!=null&&sp.y1!=null&&Math.abs(sp.y1-sp.y0)>=0.012)){const t=Math.min(sp.y0,sp.y1),b=Math.max(sp.y0,sp.y1);h+=`<div class="mk-streak" style="left:${sp.x*100}%;top:${t*100}%;height:${(b-t)*100}%"><b>${i+1}</b>${lab}</div>`}
    else h+=`<div class="mk-spot" style="left:${sp.x*100}%;top:${sp.y*100}%"><b>${i+1}</b>${lab}</div>`});return h}
const rfString=m=>(m.spots||[]).map((sp,i)=>{const rf=rfOf(m,sp);if(rf==null)return null;const rg=spotRange(m,sp);return `${sp.label||'plamka '+(i+1)} ${fmtRf(rf)}${rg?` (${fmtRf(rg[0])}–${fmtRf(rg[1])})`:''}`}).filter(Boolean).join('; ');
function openRfEditor(thumb){
  const src=photoSrc(thumb.dataset.pid);if(!src)return;
  let m;try{m=JSON.parse(thumb.dataset.marks||'null')}catch(e){m=null}m=m||{spots:[]};m.spots=m.spots||[];
  let mode=null;const hist=[];let drag=null;
  const ov=document.createElement('div');ov.className='rfx';document.body.appendChild(ov);const Z=makeZoomer(ov,'fit');Z.onCancel=()=>{drag=null;const t=ov.querySelector('#rfTmp');if(t)t.innerHTML=''};
  const cur=()=>mode||(m.start==null?'start':m.front==null?'front':'spot');
  function draw(){
    const box=ov.querySelector('.rfx-img');const st=box?[box.scrollTop,box.scrollLeft]:[0,0];const c=cur();
    ov.innerHTML=`<div class="rfx-h"><b>Wyznacz Rf</b><span class="sp"></span>${Z.ctl()}</div>
    <div class="rfx-modes">${[['start','① Start'],['front','② Czoło'],['spot','③ Plamki'],['lane','④ Ścieżki']].map(([k,l])=>`<button type="button" data-r="mode" data-v="${k}" class="btn sm ${c===k?'primary':''}">${l}</button>`).join('')}<button type="button" data-r="undo" class="btn sm ghost" ${hist.length?'':'disabled'}>Cofnij</button></div>
    <div class="rfx-hint">${c==='lane'?'Dotknij nad każdą ścieżką (od lewej) – podpiszesz je poniżej (S, Co, R…).':c==='start'?'Dotknij linii, na której nanosiłeś próbki.':c==='front'?'Dotknij miejsca, dokąd doszedł rozpuszczalnik.':'Plamka: dotknij jej środka – albo przeciągnij od dołu do góry, jeśli jest rozmyta. Dwa palce: przybliż i przesuń.'}</div>
    <div class="rfx-stage"><div class="rfx-img ${Z.boxCls()}"><div class="mkwrap draw ${Z.cls()}" style="${Z.style()}"><img src="${src}" alt="płytka TLC" draggable="false">${marksHtml(m)}<div id="rfTmp"></div></div></div>${Z.mini(src)}</div>
    <div class="rfx-list">${(m.lanes||[]).length?`<div class="lanes">${m.lanes.map((l,i)=>`<span><input data-l="${i}" value="${esc(l.label)}" placeholder="ścieżka"><button type="button" data-r="dell" data-i="${i}" aria-label="Usuń ścieżkę">×</button></span>`).join('')}</div>`:''}${m.start!=null&&m.front!=null?`<div class="hint" style="margin:2px 0 6px">Rf = droga plamki od startu ÷ droga czoła od startu. <label style="display:inline;margin:0">Droga czoła (cm, z linijki – opcjonalnie): <input id="rfCm" inputmode="decimal" value="${esc(m.cm||'')}" style="width:70px;display:inline-block;padding:4px 6px;margin:0"></label></div>`:''}${m.spots.length?m.spots.map((sp,i)=>{const rf=rfOf(m,sp);const rg=spotRange(m,sp);const df=m.start!=null&&m.front!=null?Math.abs(m.start-m.front):null;const cm=num(m.cm);const ds=rf!=null&&df!=null?rf*(cm||df*100):null;const dfu=cm||(df!=null?df*100:null);return `<div class="rr" style="grid-template-columns:28px 1fr 96px 34px"><span class="mono mute">${i+1}</span><input data-i="${i}" placeholder="nazwa (np. S, P)" value="${esc(sp.label)}"><span class="rv">${rf!=null?fmtRf(rf):'–'}${rg?`<div class="mute" style="font-size:10px">${fmtRf(rg[0])}–${fmtRf(rg[1])}</div>`:''}${ds!=null?`<div class="mute" style="font-size:10px;font-weight:500">${fmtNum(ds)} / ${fmtNum(dfu)} ${cm?'cm':'%'}</div>`:''}</span><button type="button" class="btn sm ghost bad" data-r="del" data-i="${i}">×</button></div>`}).join(''):'<div class="hint">Brak plamek.</div>'}</div>
    <div class="rfx-f"><button type="button" class="btn ghost" data-r="cancel">Anuluj</button><span class="sp"></span><button type="button" class="btn primary" data-r="save">Zapisz Rf</button></div>`;
    const nb=ov.querySelector('.rfx-img');nb.scrollTop=st[0];nb.scrollLeft=st[1];Z.ui();
  }
  const snap=()=>hist.push(JSON.stringify(m));
  const pos=(ev,w)=>{const r=w.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(ev.clientY-r.top)/r.height))}};
  ov.addEventListener('pointerdown',ev=>{const w=ev.target.closest('.rfx-img .mkwrap');if(!w)return;ev.preventDefault();const p=pos(ev,w);drag={w,x:p.x,y0:p.y,y1:p.y};try{w.setPointerCapture(ev.pointerId)}catch(e){}});
  ov.addEventListener('pointermove',ev=>{if(!drag)return;const p=pos(ev,drag.w);drag.y1=p.y;if(cur()==='spot'){const t=Math.min(drag.y0,drag.y1),b=Math.max(drag.y0,drag.y1);const tmp=ov.querySelector('#rfTmp');if(tmp)tmp.innerHTML=b-t>=0.012?`<div class="mk-streak" style="left:${drag.x*100}%;top:${t*100}%;height:${(b-t)*100}%"></div>`:''}});
  ov.addEventListener('pointerup',ev=>{if(!drag)return;const d=drag;drag=null;const c=cur();snap();
    if(c==='start'){m.start=d.y1;mode=null}else if(c==='front'){m.front=d.y1;mode=null}
    else if(c==='lane'){m.lanes=m.lanes||[];m.lanes.push({x:d.x,label:['S','Co','R','P','F'][m.lanes.length]||''});m.lanes.sort((a,b)=>a.x-b.x)}
    else{const t=Math.min(d.y0,d.y1),b=Math.max(d.y0,d.y1);if(b-t<0.012)m.spots.push({x:d.x,y:d.y0,label:''});else m.spots.push({x:d.x,y:(t+b)/2,y0:t,y1:b,label:''})}
    draw()});
  ov.addEventListener('pointercancel',()=>{drag=null});
  ov.addEventListener('click',ev=>{const b=ev.target.closest('[data-r]');if(!b)return;const a=b.dataset.r;
    if(a==='mode'){mode=b.dataset.v;draw()}
    else if(a==='undo'&&hist.length){m=JSON.parse(hist.pop());draw()}
    else if(a==='del'){snap();m.spots.splice(+b.dataset.i,1);draw()}
    else if(a==='dell'){snap();m.lanes.splice(+b.dataset.i,1);draw()}
    else if(a==='cancel')ov.remove();
    else if(a==='save'){if(m.start==null||m.front==null){toast('Zaznacz linię startu i czoło rozpuszczalnika');return}
      thumb.dataset.marks=JSON.stringify(m);thumb.classList.add('has-rf');const row=thumb.closest('.tlc-row');const str=rfString(m);if(row&&str)row.querySelector('[data-f=rf]').value=str;if(row&&(m.lanes||[]).length){const lf=row.querySelector('[data-f=lanes]');if(lf&&!lf.value.trim())lf.value=m.lanes.map(l=>l.label||'?').join(' | ')}ov.remove();toast(str?'Rf: '+str:'Zapisano oznaczenia')}});
  ov.addEventListener('change',ev=>{if(ev.target.id==='rfCm'){m.cm=ev.target.value.trim();draw();return}if(ev.target.dataset.l!=null){m.lanes[+ev.target.dataset.l].label=ev.target.value.trim();draw();return}const i=ev.target.dataset.i;if(i!=null&&ev.target.tagName==='INPUT'){m.spots[+i].label=ev.target.value.trim();draw()}});
  draw();
}

const libDec=v=>v===''||v==null?'':String(v).replace('.',',');
function reagLib(){const m=new Map();LIB.forEach(([n,M,d,smi,role,formula,info,c])=>m.set(n.toLowerCase(),{name:n,M:libDec(M),d:libDec(d),smiles:smi,role,formula:formula||'',info:info||'',c:libDec(c),builtin:true}));
  Store.list('syn').forEach(s=>(s.reag||[]).forEach(r=>{if(r.name&&(r.M||r.smiles)){const k=r.name.toLowerCase();const o=m.get(k)||{};m.set(k,{...o,name:r.name,M:r.M||o.M||'',d:r.d||o.d||'',smiles:r.smiles||o.smiles||'',role:r.role||o.role,c:r.c||o.c||'',fromSyn:!o.builtin&&!o.own,builtin:o.builtin,own:o.own})}}));
  Store.list('cmp').forEach(x=>{const k=(x.name||'').toLowerCase();if(!k)return;if(x.deleted){m.delete(k);return}m.set(k,{...(m.get(k)||{}),...x,own:true,id:x.id})});
  return m}
const F=['m','V','n','eq'];
/* liczy wiersz: src = co użytkownik wpisał (m, V, n lub eq); nRef = mmol substratu odniesienia */
function solveRow(r,nRef){
  const M=num(r.M),d=num(r.d),c=num(r.c);let m=num(r.m),V=num(r.V),n=num(r.n),eq=num(r.eq);const src=r.src||'m';
  if(src==='eq'&&eq!=null&&nRef)n=eq*nRef;
  if(src==='m'&&m!=null){n=M?m/M:null;V=d?m/(d*1000):(c&&n!=null?n/c:null)}
  else if(src==='V'&&V!=null){m=d?V*d*1000:null;n=m!=null&&M?m/M:(c?c*V:null);if(m==null&&n!=null&&M)m=n*M}
  else if((src==='n'||src==='eq')&&n!=null){m=M?n*M:null;V=d&&m!=null?m/(d*1000):(c?n/c:null)}
  if(src!=='eq')eq=n!=null&&nRef?n/nRef:null;
  return{m,V,n,eq};
}
function reagTable(list){
  const out=[];let nRef=null;
  list.forEach((r,i)=>{const s=solveRow(r,i===0?null:nRef);if(i===0){nRef=s.n;s.eq=s.n!=null?1:null}out.push({...r,...s})});return out;
}
const f2=x=>x==null||!isFinite(x)?'':String(Math.round(x*1000)/1000).replace('.',',');
function recalcForm(form){
  const rows=[...form.querySelectorAll('.reag-row')];let nRef=null;
  rows.forEach((row,i)=>{const r={};row.querySelectorAll('[data-f]').forEach(x=>r[x.dataset.f]=x.value);r.src=row.dataset.src||'m';
    const s=solveRow(r,i===0?null:nRef);if(i===0){nRef=s.n;s.eq=s.n!=null?1:null}
    F.forEach(k=>{const inp=row.querySelector(`[data-f=${k}]`);if(k===r.src){inp.classList.add('src');inp.classList.remove('auto')}else{inp.value=f2(s[k]);inp.classList.toggle('auto',inp.value!=='');inp.classList.remove('src')}});
    row.querySelector('.calc').textContent=i===0?'substrat odniesienia = 1 eq':''});
}
const ROLES={sub:'substrat',rea:'reagent',cat:'katalizator',solv:'rozpuszczalnik'};
const ROW_REAG=(r={})=>`<div class="drow reag-row" data-src="${esc(r.src||'m')}"><input class="nm" data-f="name" list="reaglib" placeholder="odczynnik / substrat / rozpuszczalnik" value="${esc(r.name)}"><button type="button" class="x" data-s="delrow" aria-label="Usuń">×</button>

  <label>masa mg<input data-f="m" inputmode="decimal" value="${esc(f2(num(r.m)))}"></label><label>obj. ml<input data-f="V" inputmode="decimal" value="${esc(f2(num(r.V)))}"></label><label>mmol<input data-f="n" inputmode="decimal" value="${esc(f2(num(r.n)))}"></label><label>eq<input data-f="eq" inputmode="decimal" value="${esc(f2(num(r.eq)))}"></label>
  <label class="full">SMILES (do rysowania wzoru – opcjonalnie)<input class="smi" data-f="smiles" value="${esc(r.smiles)}" placeholder="np. OC(=O)CC(=O)O" autocapitalize="off" spellcheck="false"></label>

/* ===== schemat reakcji (SmilesDrawer) ===== */
function molHtml(name,smi){if(smi&&window.SmilesDrawer)return `<div class="mol"><svg data-smi="${esc(smi)}" width="150" height="110"></svg><div class="mn">${esc(name||'')}</div></div>`;return `<div class="mol"><div class="mbox">${esc(name||'?')}</div></div>`}
function schemeHtml(s){const R=s.reag||[];const T=reagTable(R);const role=(r,i)=>r.role||(i===0?'sub':'rea');
  const subs=R.filter((r,i)=>role(r,i)==='sub'&&r.name);const above=R.filter((r,i)=>(role(r,i)==='rea'||role(r,i)==='cat')&&r.name);const solv=R.filter((r,i)=>role(r,i)==='solv'&&r.name);const p=s.product||{};
  if(!subs.length&&!p.name&&!p.smiles)return'';
  const eqOf=r=>{const t=T[R.indexOf(r)];return t&&t.eq!=null&&R.indexOf(r)>0?` (${fmtNum(t.eq)} eq)`:''};
  const cond=(s.conditions||'').split('\n')[0];
  return `<div class="scheme">${subs.map(r=>molHtml(r.name,r.smiles)).join('<div class="plus">+</div>')||molHtml('substrat','')}<div class="arrow"><div>${above.map(r=>esc(r.name)+eqOf(r)).join('<br>')}</div><div class="line"></div><div class="bl">${[...solv.map(r=>esc(r.name)),esc(cond)].filter(Boolean).join('<br>')}</div></div>${molHtml(p.name||'produkt',p.smiles)}</div>`}
function drawMolecules(root=document){if(!window.SmilesDrawer)return;
  root.querySelectorAll('svg[data-smi]:not([data-done])').forEach(svg=>{svg.setAttribute('data-done','1');if(!svg.id)svg.id='m'+newId();
    const fail=()=>{svg.outerHTML='<div class="molerr">błędny SMILES</div>'};
    try{const d=new SmilesDrawer.SvgDrawer({width:150,height:110,compactDrawing:false,bondThickness:1.1,padding:8});SmilesDrawer.parse(svg.dataset.smi,t=>{try{d.draw(t,svg.id,document.documentElement.dataset.theme==='light'?'light':'dark')}catch(e){fail()}},fail)}catch(e){fail()}})}
let _prevT=null;
function schedulePrev(f){clearTimeout(_prevT);_prevT=setTimeout(()=>{const box=f.querySelector('#schemePrev');if(!box)return;
  const reag=[...f.querySelectorAll('.reag-row')].map(row=>{const o={src:row.dataset.src};row.querySelectorAll('[data-f]').forEach(x=>o[x.dataset.f]=x.value.trim());return o});
  const html=schemeHtml({reag,product:{name:f.p_name.value,smiles:f.p_smiles.value},conditions:f.conditions.value});box.innerHTML=html||'<div class="hint">Wpisz substraty (rola „substrat”) i produkt – schemat narysuje się sam. Wzory rysują się z kodu SMILES.</div>';drawMolecules(box)},350)}

function templates(){const m=new Map();Object.entries(TPL_DEFAULT).forEach(([k,t])=>m.set('tpl-'+k,{...t,id:'tpl-'+k,builtin:true}));
  Store.list('tpl').forEach(t=>m.set(t.id,{...(m.get(t.id)||{}),...t}));return [...m.values()].filter(t=>!t.deleted)}
const tplToSyn=t=>{const o=JSON.parse(JSON.stringify(t));['id','kind','d','builtin','deleted','created','updated'].forEach(k=>delete o[k]);o.steps=(o.steps||[]).map(x=>({id:newId(),text:typeof x==='string'?x:x.text,done:false}));o.reag=(o.reag||[]).map(r=>({...r,added:false,addedAt:''}));return o};

  if(a.tech==='uv'){const A=num(v.abs),c=num(v.conc),l=num(v.path)||1;if(A!=null&&c)return `ε = ${Math.round(A/(c*1e-6*l)).toLocaleString('pl-PL')} L·mol⁻¹·cm⁻¹`}

function fracGrid(s,c){return `<div class="fgrid">${c.fractions.map(f=>{const k=CONTENT[f.content||''];return `<div class="fr" style="background:${k[1]};color:${k[2]}" data-a="editFrac" data-id="${s.id}" data-n="${f.n}" title="${esc(f.eluent)}">${f.n}<small>${esc(k[0])}</small></div>`}).join('')}</div>`}
function columnPanel(s){
  const c=colOf(s);const step=c.program[c.cur]||{};const fv=num(c.fracVol);
  const inStep=c.fractions.filter(f=>f.step===c.cur);const usedStep=fv?inStep.length*fv:null;const pv=num(step.vol);
  const totalPlan=c.program.reduce((a,p)=>a+(num(p.vol)||0),0);const totalUsed=fv?c.fractions.length*fv:null;
  const by=k=>c.fractions.filter(f=>(f.content||'')===k).map(f=>f.n);
  return `<div class="card" style="border-color:rgba(232,196,90,.55)"><div class="label"><span>Kolumna w toku</span><span class="mono">${c.startedAt?'start '+fmtDT(c.startedAt):''}</span></div>
    <div class="bigstep"><div class="k">Etap ${c.cur+1} z ${c.program.length} · teraz eluuje</div><div class="el">${esc(step.eluent||'—')}</div>
      <div class="mute mono" style="font-size:12.5px">${pv?`${usedStep!=null?fmtNum(usedStep):'?'} / ${fmtNum(pv)} ml`:''}${inStep.length?` · frakcje ${ranges(inStep.map(f=>f.n))}`:''}</div>
      ${pv&&usedStep!=null?`<div class="bar"><i style="width:${Math.min(100,usedStep/pv*100)}%"></i></div>`:''}</div>
    <button class="btn primary fracbtn" data-a="addFrac" data-id="${s.id}">+ Frakcja nr ${c.fractions.length+1}</button>
    <div class="row-btns" style="margin-top:10px;justify-content:space-between"><button class="btn sm" data-a="stepPrev" data-id="${s.id}" ${c.cur>0?'':'disabled'}>◀ Poprzedni etap</button><button class="btn sm" data-a="undoFrac" data-id="${s.id}" ${c.fractions.length?'':'disabled'}>Cofnij frakcję</button><button class="btn sm" data-a="stepNext" data-id="${s.id}" ${c.cur<c.program.length-1?'':'disabled'}>Następny etap ▶</button></div>
    ${pv&&usedStep!=null&&usedStep>=pv&&c.cur<c.program.length-1?'<div class="banner" style="margin-top:10px">Zużyto zaplanowaną objętość tego etapu – czas przejść do następnego eluentu.</div>':''}
  </div>
  <div class="card"><div class="label">Program elucji <button class="btn sm ghost" data-a="editCol" data-id="${s.id}">Edytuj</button></div>
    <div class="steps">${c.program.map((p,i)=>`<div class="st ${i===c.cur?'now':i<c.cur?'done':''}" data-a="setStep" data-id="${s.id}" data-i="${i}" style="cursor:pointer"><b>${i+1}</b><div class="grow">${esc(p.eluent)}<div class="mute" style="font-size:12px">${p.vol?esc(p.vol)+' ml':''}</div></div>${i===c.cur?'<span class="chip acc">teraz</span>':''}</div>`).join('')}</div>
    <div class="hint">${fv?`Frakcja = ${fmtNum(fv)} ml${c.collect?' · '+esc(c.collect):''} · razem zebrano ~${fmtNum(totalUsed)} ml${totalPlan?' z '+fmtNum(totalPlan)+' ml programu':''}`:'Ustaw objętość frakcji, żeby liczyć zużycie eluentu.'}</div></div>
  <div class="card"><div class="label">Frakcje · ${c.fractions.length} <button class="btn sm ghost" data-a="bulkFrac" data-id="${s.id}" ${c.fractions.length?'':'disabled'}>Zaznacz zakres</button></div>
    ${c.fractions.length?fracGrid(s,c):'<div class="empty">Dotknij „+ Frakcja” przy każdej zebranej probówce – eluent zapisze się sam.</div>'}
    <div class="legend" style="margin-top:10px">${Object.entries(CONTENT).map(([k,v])=>`<span><i style="background:${v[1]};height:10px;width:10px;border-radius:3px"></i>${v[0]}${by(k).length?' ('+ranges(by(k))+')':''}</span>`).join('')}</div>
    <div class="hint">Dotknij frakcji, żeby oznaczyć wynik TLC. „Zaznacz zakres” oznacza wiele naraz.</div></div>
  <div class="row-btns" style="margin-bottom:10px"><button class="btn ghost" data-a="endCol" data-id="${s.id}">Zakończ kolumnę</button></div>`;
}

function openSheet({title,body,onSave,onDelete,onAction,saveLabel='Zapisz'}){
  const root=$('#sheet-root');
  root.innerHTML=`<div class="backdrop" data-s="close"></div><form class="sheet" novalidate autocomplete="off">
   <div class="sheet-h"><div class="grab"></div><h3>${esc(title)}</h3></div><div class="sheet-b">${body}</div>
   <div class="sheet-f">${onDelete?'<button type="button" class="btn ghost bad" data-s="del">Usuń</button>':''}<span class="sp"></span><button type="button" class="btn ghost" data-s="close">${onSave?'Anuluj':'Zamknij'}</button>${onSave?`<button type="submit" class="btn primary">${esc(saveLabel)}</button>`:''}</div></form>`;
  requestAnimationFrame(()=>root.classList.add('open'));
  const form=root.querySelector('form');let busy=false;
  form.onsubmit=async ev=>{ev.preventDefault();if(busy||!onSave)return;form.querySelectorAll('.err').forEach(x=>x.classList.remove('err'));
    const bad=[...form.querySelectorAll('[required]')].find(x=>!x.value.trim());if(bad){bad.classList.add('err');bad.focus();toast('Uzupełnij wymagane pola');return}
    busy=true;try{const r=await onSave(form);if(r!==false)closeSheet()}catch(err){console.error(err);toast('Coś poszło nie tak')}finally{busy=false}};
  root.onclick=async ev=>{const b=ev.target.closest('[data-s]');if(!b)return;const s=b.dataset.s;
    if(s==='close')closeSheet();
    else if(s==='del'){if(b.dataset.armed){await onDelete();closeSheet();toast('Usunięto')}else{b.dataset.armed='1';b.textContent='Na pewno usunąć?'}}
    else if(s==='addrow'){form.querySelector(b.dataset.target).insertAdjacentHTML('beforeend',ROWS[b.dataset.row]());const rows=form.querySelectorAll(b.dataset.target+' .drow');const last=rows[rows.length-1];last&&last.querySelector('input').focus();if(b.dataset.row==='reag')recalcForm(form)}
    else if(s==='delrow'){b.closest('.drow').remove();recalcForm(form)}
    else if(s==='delphoto')b.closest('.thumb').remove();
    else if(s==='rf')openRfEditor(b.closest('.thumb'));
    else if(s==='bands')openBandEditor(b.closest('.thumb'));
    else if(onAction)onAction(s,b,form)};
  root.onchange=async ev=>{const inp=ev.target;if(inp.type!=='file'||!inp.files.length||!inp.closest('.photos'))return;const files=[...inp.files];inp.value='';const lab=inp.closest('label');
    toast(files.length>1?`Przetwarzam ${files.length} zdjęcia…`:'Przetwarzam zdjęcie…');
    for(const f of files){const d=await compressImage(f).catch(()=>null);if(!d){toast('Nie udało się wczytać zdjęcia');continue}const pid='tmp'+newId();pendingPhotos.set(pid,d);const pk=lab.closest('.photos').dataset.key;const isT=pk==='tlc';lab.insertAdjacentHTML('beforebegin',thumbEdit(pid,null,isT?'Rf':pk==='an'?'Pasma':false));if(isT&&files.length===1)openRfEditor(lab.previousElementSibling);if(pk==='an'&&files.length===1)openBandEditor(lab.previousElementSibling)}};
  return form;
}

async function detectBands(src,m,dir,res){res=res||0.012;

  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');cx.drawImage(img,0,0,W,H);
  const px=cx.getImageData(0,0,W,H).data;const Lum=new Float32Array(W*H);for(let i=0;i<W*H;i++)Lum[i]=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];

function tlcHint(row){
  const spots=[];row.querySelectorAll('.thumb').forEach(t=>{let mk=null;try{mk=JSON.parse(t.dataset.marks||'null')}catch(e){}if(mk)(mk.spots||[]).forEach((sp,i)=>{const rf=rfOf(mk,sp);if(rf!=null)spots.push({l:(sp.label||'').trim(),rf})})});
  if(!spots.length){const s=(row.querySelector('[data-f=rf]')||{}).value||'';s.split(';').forEach(p=>{const mm=p.trim().match(/^(.*?)\s*([01][.,]\d+)/);if(mm)spots.push({l:mm[1].trim(),rf:num(mm[2])})})}
  if(!spots.length)return 'Zaznacz plamki na zdjęciu (nazwij je np. S i P) albo wpisz Rf – wtedy podpowiem wniosek.';
  const find=re=>spots.find(x=>re.test(x.l));const P=find(/^(p|prod)/i),S=find(/^(s|sm|sub)/i);const out=[];
  if(P&&S){const d=Math.abs(P.rf-S.rf);out.push(d<0.1?`Słaby rozdział P/S (ΔRf ${fmtRf(d)}) – spróbuj innego układu eluentów (np. toluen/AcOEt, DCM/MeOH).`:`Dobry rozdział P/S (ΔRf ${fmtRf(d)}).`)}
  if(P){out.push(P.rf>0.5?`Rf produktu ${fmtRf(P.rf)} – do kolumny weź słabszy eluent (cel: Rf ≈ 0,25–0,35).`:P.rf<0.15?`Rf produktu ${fmtRf(P.rf)} – eluent za słaby, zwiększ udział składnika polarnego.`:`Rf produktu ${fmtRf(P.rf)} – dobry do kolumny w tym eluencie.`)}
  if(S)out.push('Jeśli w ścieżce mieszaniny (R) nie ma już plamki S – substrat przereagował; słaba plamka S = reakcja jeszcze trwa.');
  const others=spots.filter(x=>x!==P&&x!==S);if(others.length)out.push(`Inne plamki: ${others.map(x=>(x.l||'?')+' '+fmtRf(x.rf)).join(', ')} – produkty uboczne lub zanieczyszczenia.`);
  if(!P&&!S)out.push('Nazwij plamki S (substrat) i P (produkt), żeby dostać pełniejszą podpowiedź.');
  return out.join(' ');
}

function pubFor(m,a){const t=m.tech;const v=(a&&a.v)||{};const S=sortBands(m).filter(b=>b.v!=null&&!/rozpuszczalnik/.test(b.label||''));if(!S.length)return'';const f=b=>dotN(bandFmt(t,b.v));
  if(t==='ir')return `IR (${v.mode||'ATR'}) ν ${S.map(b=>f(b)+(b.int?` (${b.int})`:'')).join(', ')} cm⁻¹.`;
  if(t==='raman')return `Raman${v.laser?` (λexc = ${dotN(v.laser)} nm)`:''} ν ${S.map(b=>f(b)+(b.int?` (${b.int})`:'')).join(', ')} cm⁻¹.`;
  if(t==='h'||t==='c'){const nuc=t==='h'?'¹H':'¹³C';return `${nuc} NMR (${[v.freq&&dotN(v.freq)+' MHz',v.solv].filter(Boolean).join(', ')||'—'}) δ ${S.map(f).join(', ')}.`}
  if(t==='uv')return `UV-Vis${v.solv?` (${v.solv})`:''} λmax ${S.map(f).join(', ')} nm.`;
  if(t==='fl')return `Fluorescencja${v.lex?` (λex = ${dotN(v.lex)} nm)`:''} λem ${S.map(f).join(', ')} nm.`;
  if(t==='ms')return `MS (${v.ion||'ESI'}) m/z ${S.map(b=>f(b)+(b.label&&/^\[|M/.test(b.label)?` (${b.label.split(' (')[0]})`:'')).join(', ')}.`;
  if(t==='epr'){const nu=num(m.nu)||9.5;return `EPR (${(v.band||'X').split(' ')[0]}-band, ν = ${nu.toFixed(2)} GHz${v.temp?', '+dotN(v.temp)+' K':''}): ${S.map(b=>{const g=eprG(m,b);const dB=((b.int||'').match(/[\d]+[,.]?\d*/)||[''])[0];return `g = ${g?g.toFixed(4):'–'}${dB?`, ΔBpp = ${dotN(dB)} mT`:''}`}).join('; ')}.`}
  return S.map(f).join(', ')}
function bandsOf(a){if(!a||!a.marks)return null;const L=Object.values(a.marks).filter(m=>m&&m.bands&&m.bands.length);if(!L.length)return null;const m={...L[0],bands:L.flatMap(x=>x.bands)};return m}
function sigBlock(a){const m=bandsOf(a);if(!m)return'';m.tech=a.tech;const p=pubFor(m,a);
  return `<div class="sigs">${sigHead(m)}${sigRows(m)}</div>${sigChips(m)}${p?`<div class="pub"><div class="ph"><span class="slab">Zapis do publikacji</span><button type="button" class="btn sm" data-a="copyPub" data-t="${esc(p)}">Kopiuj</button></div><div class="pt">${esc(p)}</div></div>`:''}`}

/* ===== TLC: tabela plamek ===== */
function laneOf(m,sp){const L=m.lanes||[];if(!L.length)return'';let best=null;L.forEach(l=>{const d=Math.abs(l.x-sp.x);if(best==null||d<best[0])best=[d,l.label]});return best&&best[0]<0.12?best[1]||'':''}
function spotRole(name,lane){const s=(name||'').trim();if(/^(p|prod)/i.test(s))return['produkt','p'];if(/^(s|sm|sub)/i.test(s))return['substrat','s'];if(/dcu|ubocz|zanieczy/i.test(s))return['uboczny','u'];return null}
function tlcSpotRows(m){return(m.spots||[]).map((sp,i)=>{const rf=rfOf(m,sp);const ln=laneOf(m,sp);const r=spotRole(sp.label,ln);
  return `<div class="srow" style="grid-template-columns:24px 58px 46px 1fr auto" data-bx="${sp.x}" data-by="${sp.y}"><i class="sn">${i+1}</i><span class="sv mute">${esc(ln||'–')}</span><span class="sv">${rf!=null?fmtRf(rf):'–'}</span><span class="sl">${esc(sp.label||'plamka')}</span>${r?`<span class="role r-${r[1]}">${r[0]}</span>`:'<span></span>'}</div>`}).join('')}
function tlcBlock(t){const L=Object.values(t.marks||{}).filter(m=>m&&(m.spots||[]).length);if(!L.length)return'';
  return `<div class="sigs">${L.map(m=>`<div class="srow sh" style="grid-template-columns:24px 58px 46px 1fr auto"><span>#</span><span>ścieżka</span><span>Rf</span><span>plamka</span><span></span></div>${tlcSpotRows(m)}`).join('')}</div>`}

/* ===== GALERIA (przeglądanie zdjęć jak w telefonie) ===== */
function openGallery(items,idx,info){
  if(!items.length)return;let i=Math.max(0,Math.min(items.length-1,idx||0));
  const g=document.createElement('div');g.className='gal';document.body.appendChild(g);
  let z=1,tx=0,ty=0,base=null;const pts=new Map();let pinch=null,drag=null,lastTap=0,moved=false;
  const it=()=>items[i];
  function panelHtml(){const x=it();const m=x.marks;let h='';
    if(m&&m.bands&&m.bands.length){const mm={...m,tech:m.tech||x.tech};h+=`<div class="gp-h"><b>Sygnały</b><span>${m.bands.length} ${m.bands.length===1?'sygnał':'sygnałów'} <em id="gvis"></em></span><span class="u">${BAND_UNIT[mm.tech]||''}</span></div><div class="sigs dark">${sigHead(mm)}${sigRows(mm,{nums:true,vis:visRange()})}</div>${sigChips(mm)}`}
    else if(m&&(m.spots||[]).length){h+=`${x.cond?`<div class="gchips">${x.cond.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}<div class="gp-h"><b>Plamki</b><span>${(m.lanes||[]).length?'ścieżki: '+m.lanes.map(l=>esc(l.label||'?')).join(' · '):''}</span></div><div class="sigs dark"><div class="srow sh" style="grid-template-columns:24px 58px 46px 1fr auto"><span>#</span><span>ścieżka</span><span>Rf</span><span>plamka</span><span></span></div>${tlcSpotRows(m)}</div>`}
    if(x.concl)h+=`<div class="gconcl"><b>Co z tego wynika</b>${esc(x.concl)}</div>`;
    return h||'<div class="gp-empty">Zdjęcie bez oznaczeń.</div>'}
  function render(){const x=it();
    g.innerHTML=`<div class="g-top"><button type="button" class="g-x" data-g="close" aria-label="Zamknij">✕</button><div class="g-t"><b>${esc(x.title||'Zdjęcie')}</b>${x.sub?`<span>${esc(x.sub)}</span>`:''}</div><span class="g-n">${i+1} / ${items.length}</span></div>
    <div class="g-stage"><div class="g-wrap"><div class="mkwrap"><img src="${x.src}" alt="" draggable="false">${marksHtml(x.marks)}</div></div>
      <span class="g-z" hidden></span><div class="g-mini" hidden><img src="${x.src}" alt=""><i></i></div>
      ${items.length>1?`<button type="button" class="g-prev" data-g="prev" aria-label="Poprzednie">‹</button><button type="button" class="g-next" data-g="next" aria-label="Następne">›</button>`:''}</div>
    ${items.length>1?`<div class="g-dots">${items.map((_,k)=>`<span class="${k===i?'on':''}"></span>`).join('')}</div>`:''}
    <div class="g-hint">szczypnij lub stuknij dwa razy, żeby przybliżyć${items.length>1?' · przesuń w bok: następne':''}</div>
    <div class="g-panel"><div class="g-grab"></div><div id="gpan">${panelHtml()}</div></div>`;
    z=1;tx=0;ty=0;base=null;const img=g.querySelector('.g-wrap img');if(img.complete)fit();else img.onload=fit;}
  function fit(){const st=g.querySelector('.g-stage'),w=g.querySelector('.g-wrap'),img=w.querySelector('img');const sr=st.getBoundingClientRect();const ar=(img.naturalHeight||1)/(img.naturalWidth||1);
    let W=sr.width,H=W*ar;if(H>sr.height){H=sr.height;W=H/ar}base={W,H,x:(sr.width-W)/2,y:(sr.height-H)/2,sw:sr.width,sh:sr.height};w.style.width=W+'px';w.style.height=H+'px';apply()}
  function clamp(){if(!base)return;const W=base.W*z,H=base.H*z;
    const minx=Math.min(base.sw-W-base.x,(base.sw-W)/2-base.x),maxx=Math.max(-base.x,(base.sw-W)/2-base.x);const miny=Math.min(base.sh-H-base.y,(base.sh-H)/2-base.y),maxy=Math.max(-base.y,(base.sh-H)/2-base.y);
    tx=Math.min(maxx,Math.max(minx,tx));ty=Math.min(maxy,Math.max(miny,ty))}
  function visRange(){if(!base||z<=1.05)return null;const x0=(-base.x-tx)/(base.W*z),x1=(base.sw-base.x-tx)/(base.W*z);return[Math.max(0,x0),Math.min(1,x1)]}
  function apply(anim){if(!base)return;clamp();const w=g.querySelector('.g-wrap');w.style.transition=anim?'transform .22s ease':'none';w.style.transform=`translate(${base.x+tx}px,${base.y+ty}px) scale(${z})`;w.style.setProperty('--iz',1/z);
    const zl=g.querySelector('.g-z');zl.hidden=z<=1.05;zl.textContent=z.toFixed(1).replace('.',',')+'×';
    const mi=g.querySelector('.g-mini');mi.hidden=z<=1.05;if(z>1.05){const r=mi.querySelector('i');const x0=(-base.x-tx)/(base.W*z),y0=(-base.y-ty)/(base.H*z),x1=(base.sw-base.x-tx)/(base.W*z),y1=(base.sh-base.y-ty)/(base.H*z);
      r.style.left=Math.max(0,x0)*100+'%';r.style.top=Math.max(0,y0)*100+'%';r.style.width=(Math.min(1,x1)-Math.max(0,x0))*100+'%';r.style.height=(Math.min(1,y1)-Math.max(0,y0))*100+'%'}
    const vr=visRange();g.querySelectorAll('#gpan .srow[data-bx]').forEach(r=>{const x=+r.dataset.bx;r.classList.toggle('dim',!!vr&&!(x>=vr[0]&&x<=vr[1]))});
    const gv=g.querySelector('#gvis');if(gv){const m=it().marks;gv.textContent=vr?`· w kadrze ${(m.bands||[]).filter(b=>b.x>=vr[0]&&b.x<=vr[1]).length}`:''}}
  function zoomAt(nz,cx,cy,anim){nz=Math.max(1,Math.min(8,nz));const px=(cx-base.x-tx)/z,py=(cy-base.y-ty)/z;tx=cx-base.x-px*nz;ty=cy-base.y-py*nz;z=nz;if(z<=1.001){z=1;tx=0;ty=0}apply(anim)}
  const rel=ev=>{const r=g.querySelector('.g-stage').getBoundingClientRect();return[ev.clientX-r.left,ev.clientY-r.top]};
  function go(d){if(i+d<0||i+d>=items.length){apply(true);return}i+=d;render()}
  g.addEventListener('pointerdown',ev=>{const st=ev.target.closest('.g-stage');if(!st||ev.target.closest('[data-g]'))return;ev.preventDefault();pts.set(ev.pointerId,rel(ev));try{st.setPointerCapture(ev.pointerId)}catch(e){}
    if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),z0:z,m:[(a[0]+b[0])/2,(a[1]+b[1])/2]};drag=null}
    else if(pts.size===1){drag={p:rel(ev),tx,ty};moved=false}});
  g.addEventListener('pointermove',ev=>{if(!pts.has(ev.pointerId))return;pts.set(ev.pointerId,rel(ev));
    if(pinch&&pts.size>=2){const[a,b]=[...pts.values()];const mm=[(a[0]+b[0])/2,(a[1]+b[1])/2];const nz=Math.max(1,Math.min(8,pinch.z0*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d));
      tx+=mm[0]-pinch.m[0];ty+=mm[1]-pinch.m[1];pinch.m=mm;zoomAt(nz,mm[0],mm[1]);moved=true}
    else if(drag){const p=rel(ev);const dx=p[0]-drag.p[0],dy=p[1]-drag.p[1];if(Math.hypot(dx,dy)>6)moved=true;
      if(z>1.01){tx=drag.tx+dx;ty=drag.ty+dy;apply()}else{const w=g.querySelector('.g-wrap');w.style.transition='none';w.style.transform=`translate(${base.x+dx}px,${base.y}px)`}}});
  const up=ev=>{if(!pts.has(ev.pointerId))return;const p=rel(ev);pts.delete(ev.pointerId);
    if(pinch){if(pts.size<2)pinch=null;if(pts.size===1){const r=[...pts.values()][0];drag={p:r,tx,ty}}return}
    if(drag){const dx=p[0]-drag.p[0],dy=p[1]-drag.p[1];drag=null;
      if(z<=1.01&&moved){if(Math.abs(dx)>60&&Math.abs(dy)<90)go(dx<0?1:-1);else apply(true);return}
      if(!moved){const now=Date.now();if(now-lastTap<300){lastTap=0;if(z>1.05)zoomAt(1,p[0],p[1],true);else zoomAt(2.6,p[0],p[1],true)}else lastTap=now}}};
  g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
  g.addEventListener('wheel',ev=>{if(!ev.target.closest('.g-stage'))return;ev.preventDefault();const p=rel(ev);zoomAt(z*Math.exp(-ev.deltaY*0.0015),p[0],p[1])},{passive:false});
  g.addEventListener('click',ev=>{const b=ev.target.closest('[data-g]');if(b){const a=b.dataset.g;if(a==='close')close();if(a==='prev')go(-1);if(a==='next')go(1);return}
    const r=ev.target.closest('#gpan .srow[data-bx]');if(r&&base){const x=+r.dataset.bx,y=+r.dataset.by;const nz=Math.max(z,2.6);z=nz;tx=base.sw/2-base.x-x*base.W*nz;ty=base.sh/2-base.y-y*base.H*nz;apply(true)}});
  const key=ev=>{if(ev.key==='Escape')close();if(ev.key==='ArrowRight')go(1);if(ev.key==='ArrowLeft')go(-1)};document.addEventListener('keydown',key);
  const onRes=()=>{if(base){const keep=z;fit();if(keep>1)zoomAt(keep,base.sw/2,base.sh/2)}};window.addEventListener('resize',onRes);
  function close(){document.removeEventListener('keydown',key);window.removeEventListener('resize',onRes);g.remove()}
  render();
}

/* ===== przybliżanie w edytorach (szczypanie, kółko, przyciski) ===== */
function makeZoomer(ov,fitCls){
  const Z={z:1,base:0,fit:fitCls,ptrs:new Map(),pinch:null,suppress:false,onCancel:null};
  const box=()=>ov.querySelector('.rfx-img'),wrap=()=>ov.querySelector('.rfx-img .mkwrap');
  Z.cls=()=>Z.z>1.001&&Z.base?'':Z.fit;Z.style=()=>Z.z>1.001&&Z.base?`width:${Z.base*Z.z}px`:'';Z.boxCls=()=>Z.z>1.001?'zoomed':'';
  Z.ctl=()=>`<div class="zctl"><button type="button" data-r="zout" aria-label="Oddal">−</button><span class="zlab">${Z.z.toFixed(1).replace('.',',')}×</span><button type="button" data-r="zin" aria-label="Przybliż">+</button></div><button type="button" class="btn sm" data-r="zfit">Całość</button>`;
  Z.mini=src=>`<div class="zmini" ${Z.z>1.001?'':'hidden'}><img src="${src}" alt=""><i></i></div>`;
  Z.ui=()=>{const l=ov.querySelector('.zlab');if(l)l.textContent=Z.z.toFixed(1).replace('.',',')+'×';const mi=ov.querySelector('.zmini');const b=box(),w=wrap();if(!mi||!b||!w)return;mi.hidden=Z.z<=1.001;if(mi.hidden)return;
    const br=b.getBoundingClientRect(),wr=w.getBoundingClientRect();const x0=(br.left-wr.left)/wr.width,y0=(br.top-wr.top)/wr.height,x1=(br.right-wr.left)/wr.width,y1=(br.bottom-wr.top)/wr.height;const r=mi.querySelector('i');
    r.style.left=Math.max(0,x0)*100+'%';r.style.top=Math.max(0,y0)*100+'%';r.style.width=(Math.min(1,x1)-Math.max(0,x0))*100+'%';r.style.height=(Math.min(1,y1)-Math.max(0,y0))*100+'%'};
  Z.set=(nz,cx,cy)=>{const b=box(),w=wrap();if(!b||!w)return;nz=Math.max(1,Math.min(8,nz));if(Z.z<=1.001||!Z.base)Z.base=w.getBoundingClientRect().width;
    const br=b.getBoundingClientRect();if(cx==null){cx=br.width/2;cy=br.height/2}const wr=w.getBoundingClientRect();const fx=(br.left+cx-wr.left)/wr.width,fy=(br.top+cy-wr.top)/wr.height;
    Z.z=nz;if(nz<=1.001){Z.z=1;b.classList.remove('zoomed');w.style.width='';if(Z.fit)w.classList.add(Z.fit)}else{b.classList.add('zoomed');if(Z.fit)w.classList.remove(Z.fit);w.style.width=Z.base*nz+'px'}
    const w2=w.getBoundingClientRect();b.scrollLeft+=(w2.left+fx*w2.width)-(br.left+cx);b.scrollTop+=(w2.top+fy*w2.height)-(br.top+cy);Z.ui()};
  const P=ev=>[ev.clientX,ev.clientY];const D=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);const M=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
  ov.addEventListener('pointerdown',ev=>{if(!ev.target.closest('.rfx-img'))return;Z.ptrs.set(ev.pointerId,P(ev));
    if(Z.ptrs.size===2){ev.stopPropagation();ev.preventDefault();Z.onCancel&&Z.onCancel();const[a,b]=[...Z.ptrs.values()];Z.pinch={d:D(a,b),z0:Z.z,m:M(a,b)};Z.suppress=true}},true);
  ov.addEventListener('pointermove',ev=>{if(!Z.ptrs.has(ev.pointerId))return;Z.ptrs.set(ev.pointerId,P(ev));
    if(Z.pinch&&Z.ptrs.size>=2){ev.stopPropagation();ev.preventDefault();const[a,b]=[...Z.ptrs.values()];const m=M(a,b);const bx=box();const br=bx.getBoundingClientRect();
      Z.set(Z.pinch.z0*D(a,b)/Z.pinch.d,m[0]-br.left,m[1]-br.top);bx.scrollLeft-=m[0]-Z.pinch.m[0];bx.scrollTop-=m[1]-Z.pinch.m[1];Z.pinch.m=m;Z.ui()}
    else if(Z.suppress)ev.stopPropagation()},true);
  const up=ev=>{if(!Z.ptrs.has(ev.pointerId))return;Z.ptrs.delete(ev.pointerId);if(Z.ptrs.size<2)Z.pinch=null;if(Z.suppress){ev.stopPropagation();if(!Z.ptrs.size)Z.suppress=false}};
  ov.addEventListener('pointerup',up,true);ov.addEventListener('pointercancel',up,true);
  ov.addEventListener('scroll',()=>Z.ui(),true);
  ov.addEventListener('wheel',ev=>{const b=ev.target.closest('.rfx-img');if(!b)return;ev.preventDefault();const br=b.getBoundingClientRect();Z.set(Z.z*Math.exp(-ev.deltaY*0.0015),ev.clientX-br.left,ev.clientY-br.top)},{passive:false});
  ov.addEventListener('click',ev=>{const b=ev.target.closest('[data-r]');if(!b)return;const a=b.dataset.r;if(a==='zin')Z.set(Z.z*1.6);else if(a==='zout')Z.set(Z.z/1.6);else if(a==='zfit')Z.set(1)},true);
  return Z;
}

/* ===== WERSJA SAMODZIELNA (PWA): dane w IndexedDB na telefonie ===== */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('syntezylab',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction('items',mode);const st=t.objectStore('items');const rq=fn(st);t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  all(){return this.tx('readonly',st=>st.getAll())},put(o){return this.tx('readwrite',st=>st.put(o))},del(id){return this.tx('readwrite',st=>st.delete(id))}};
Store.save=async function(obj){const o=JSON.parse(JSON.stringify(obj));if(!o.id)o.id=newId();o.updated=Date.now();if(!o.created)o.created=o.updated;this.items.set(o.id,o);
  try{await IDB.put(o)}catch(e){console.warn(e);toast('Nie udało się zapisać – brak miejsca?')}render();return o};
Store.remove=async function(id){this.items.delete(id);try{await IDB.del(id)}catch(e){console.warn(e)}render()};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
async function initPWA(){
  Store.col=null;
  try{await IDB.open();const all=await IDB.all();Store.items=new Map(all.map(x=>[x.id,x]));
    const old=lsGet(LKEY);if(old&&!Store.items.size){try{for(const x of JSON.parse(old))if(x&&x.id){await IDB.put(x);Store.items.set(x.id,x)}}catch(e){}}
    Store.mode='local';setStatus('ok','w telefonie');
  }catch(e){console.warn(e);Store.mode='local';Store.items=new Map();Store.loadLocal();setStatus('warn','pamięć tymczasowa')}
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function localBanner(){return '';const last=+lsGet('syntezylab-last-backup')||0;const n=Store.items.size;if(!n)return'';const days=last?Math.floor((Date.now()-last)/864e5):null;
  if(days!=null&&days<7)return'';return `<div class="banner" data-a="settings" style="cursor:pointer">${days==null?'Nie masz jeszcze kopii zapasowej.':'Ostatnia kopia: '+days+' dni temu.'} Dane są tylko w tym telefonie – dotknij, żeby zrobić kopię.</div>`}
function backupBlob(){return new Blob([JSON.stringify({app:'syntezylab',version:1,exported:new Date().toISOString(),items:[...Store.items.values()]})],{type:'application/json'})}
const backupName=()=>`notatnik-syntez-kopia-${today()}.json`;
async function importItems(a){if(a&&!Array.isArray(a)&&Array.isArray(a.items))a=a.items;if(!Array.isArray(a)){toast('To nie jest plik kopii');return}
  let n=0;for(const x of a){if(x&&x.kind&&x.id){await IDB.put(x);Store.items.set(x.id,x);n++}}render();toast(`Wczytano ${n} rekordów`);closeSheet()}
const APP_VERSION='1.2.1';
async function settingsSheet(){
  openSheet({title:'Ustawienia',body:`${themeCard()}
    <div class="card about"><div class="label">O aplikacji</div>
      <div class="about-h">${colSvg(40)}<div><b>Notatnik Syntez</b><div class="mono mute" style="font-size:12px">wersja ${APP_VERSION}</div></div></div>
      <p>Aplikacja powstała, aby ułatwić prowadzenie notatek laboratoryjnych w sposób cyfrowy. Nie jest to aplikacja komercyjna.</p><p class="mute" style="font-size:13px;margin-top:8px">Wszystkie dane zostają w tym telefonie – aplikacja niczego nie wysyła.</p><a class="btn sm" style="margin-top:10px;display:inline-flex" href="./privacy.html">Polityka prywatności</a></div>`,
    onAction:async (s,b)=>{if(s==='theme'){setTheme(b.dataset.v);return}}});
}

function exportCsv(txt,name){const url=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name.replace(/[^\w\-.ąćęłńóśźżĄĆĘŁŃÓŚŹŻ ]+/g,'_');document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Zapisano plik CSV w Pobranych')}

readHash();render();initPWA();
